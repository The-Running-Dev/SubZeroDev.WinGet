name: Build

on:
  push:
    branches: [main]
    # Tag pushes publish the STABLE version: GitVersion emits a clean version for a
    # tagged commit, versus a prerelease for an untagged one. This filter is required —
    # with only `branches:` specified, GitHub does not run the workflow for tag pushes
    # at all, so `git push origin v0.1.0` would silently do nothing.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: Also publish the package to NuGet.org (in addition to the GitHub Packages release)
        type: boolean
        required: false
        default: false

env:
  # Pinned to match build/_build.csproj's Nuke.Common reference - keep these two in sync.
  NUKE_VERSION: 10.1.0

jobs:
  # Runs on every push to main AND every pull request: tests, coverage, architecture,
  # and package-contract verification, but never publishes. This is the required
  # status check for branch protection.
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job never publishes, so it does not strictly need full history — a shallow
          # clone would only make Nuke's eager [GitVersion] injection emit a harmless warning
          # (the value is never dereferenced here; only PublishGitHubPackages reads it).
          # fetch-depth: 0 purely silences that warning and keeps both jobs' checkouts identical.
          fetch-depth: 0

      - name: Setup .NET
        # Skipped under act host mode — the host machine already has a .NET SDK.
        if: ${{ !env.ACT }}
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x: builds and runs the product (library/tests/examples target net8).
          # 10.0.x: runs the Nuke build tooling (build/_build.csproj is net10 — Nuke.Common
          #         10.x ships lib/net10.0 only). Nuke shells out to the net8 targets.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          # `update` (not `install`) so this is idempotent: it installs the tool when
          # missing and is a no-op success when the pinned version is already present.
          # `install --version X` instead errors if a *different* version is already on
          # the host - which happens under `act` host mode (the host environment persists
          # between runs) whenever NUKE_VERSION is bumped.
          dotnet tool update --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Test, coverage, architecture, and package
        # One Nuke invocation for all requested targets. Nuke de-duplicates target execution
        # only WITHIN a single invocation, so Test and Coverage must be requested together —
        # separate `nuke Test` then `nuke Coverage` calls would re-run Test (and its
        # Restore/Compile dependencies). Coverage depends on Test, so the plan runs
        # Restore -> Compile -> Test -> Coverage exactly once, while ArchitectureTest
        # cross-builds x64/ARM64 and verifies the emitted PE headers. PackageTest then
        # validates the packed direct and transitive consumer contract without executing
        # live COM calls. A failure stops the job before release. The append step below
        # surfaces the generated markdown on the run's summary page (GITHUB_STEP_SUMMARY).
        run: nuke Test Coverage ArchitectureTest PackageTest --configuration Release

      - name: Append coverage summary
        run: Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/Cobertura.xml

  # Builds and releases the package. Three ways in, all gated on `build` so nothing
  # publishes unless tests pass:
  #   push to main   -> GitHub Packages, PRERELEASE version (0.1.0-<n>)
  #   push tag v*    -> GitHub Packages, STABLE version (0.1.0)
  #   workflow_dispatch with push_to_nuget -> NuGet.org
  # A tag push is still a `push` event, so the event_name check below covers it.
  # Pull requests never reach this job — they run the full non-publishing verification
  # suite above, including architecture and package-contract checks.
  release:
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_to_nuget == true) }}
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job DOES publish, so it genuinely needs full history: PublishGitHubPackages
          # dereferences the [GitVersion] field to derive the package version, which is fatal
          # (not just a warning) on a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x: builds and runs the product (library/tests/examples target net8).
          # 10.0.x: runs the Nuke build tooling (build/_build.csproj is net10 — Nuke.Common
          #         10.x ships lib/net10.0 only). Nuke shells out to the net8 targets.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          # `update` (not `install`) so this is idempotent: it installs the tool when
          # missing and is a no-op success when the pinned version is already present.
          # `install --version X` instead errors if a *different* version is already on
          # the host - which happens under `act` host mode (the host environment persists
          # between runs) whenever NUKE_VERSION is bumped.
          dotnet tool update --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      # Automatic release on every push to main. Version comes from GitVersion (resolved
      # by Nuke's GitVersion component). Auth uses the built-in GITHUB_TOKEN — no secret
      # needed — and --skip-duplicate makes re-pushing an unchanged version harmless.
      - name: Release to GitHub Packages
        if: ${{ github.event_name == 'push' }}
        run: nuke PublishGitHubPackages --github-token "${{ secrets.GITHUB_TOKEN }}" --github-repository-owner "${{ github.repository_owner }}"

      # Manual, opt-in release to NuGet.org. Requires the NUGET_API_KEY secret and
      # publishes the version pinned in the .csproj.
      - name: Release to NuGet.org
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: nuke PublishNuGet --nuget-api-key "${{ secrets.NUGET_API_KEY }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
