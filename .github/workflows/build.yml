name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    # Publishing a GitHub Release (which creates/points at a tag) triggers the
    # publish-github-packages job below. GitVersion derives the version from that tag.
    types: [published]
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: Push the built package to NuGet.org
        type: boolean
        required: false
        default: false

env:
  # Pinned to match build/_build.csproj's Nuke.Common reference - keep these two in sync.
  NUKE_VERSION: 10.1.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Both jobs fetch full history now, not just publish-github-packages: Nuke
          # injects the [GitVersion] field in build/Build.cs eagerly at startup regardless
          # of which target is requested, and that injection fails outright on a shallow
          # clone even though this job never calls the target that uses it.
          fetch-depth: 0

      - name: Setup .NET
        # Skipped under act host mode — the host machine already has a .NET SDK.
        if: ${{ !env.ACT }}
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x: required by the Nuke global tool and build/_build.csproj
          #         (Nuke.Common 10.x ships lib/net10.0 only).
          # 8.0.x:  the runtime the net8.0-windows library and its tests run on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          dotnet tool install --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Test
        # Restore and Compile run first automatically as Test's Nuke dependencies.
        # A failing test fails this step and stops the job — Coverage/Pack never run.
        run: nuke Test --configuration Release

      - name: Coverage report
        # Renders the coverage summary produced by Test into markdown; the append below
        # surfaces it on the workflow run's summary page (GITHUB_STEP_SUMMARY).
        run: nuke Coverage --configuration Release

      - name: Append coverage summary
        run: Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/Cobertura.xml

      - name: Pack
        run: nuke Pack --configuration Release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      - name: Push to NuGet.org
        # Off by default: runs only on a manual workflow_dispatch with push_to_nuget checked.
        # Requires the NUGET_API_KEY repository secret.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_nuget == true }}
        run: nuke PublishNuGet --nuget-api-key "${{ secrets.NUGET_API_KEY }}"

  # Publishes to GitHub Packages (the repo's public NuGet feed) when a GitHub Release
  # is published. Version comes from GitVersion (resolved automatically by Nuke's
  # GitVersion component - no manual tool install needed). Gated on the build job so a
  # release only publishes if build + tests pass. Authentication uses the automatic
  # GITHUB_TOKEN — no repository secret needed.
  publish-github-packages:
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs full history and tags to derive the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0.x: required by the Nuke global tool and build/_build.csproj
          #         (Nuke.Common 10.x ships lib/net10.0 only).
          # 8.0.x:  the runtime the net8.0-windows library and its tests run on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          dotnet tool install --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Pack and push to GitHub Packages
        run: nuke PublishGitHubPackages --github-token "${{ secrets.GITHUB_TOKEN }}" --github-repository-owner "${{ github.repository_owner }}"
