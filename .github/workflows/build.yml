name: Build

on:
  push:
    branches: [main]
    # Tag pushes publish the STABLE version: GitVersion emits a clean version for a
    # tagged commit, versus a prerelease for an untagged one. This filter is required —
    # with only `branches:` specified, GitHub does not run the workflow for tag pushes
    # at all, so `git push origin v0.1.0` would silently do nothing.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: Also publish the package to NuGet.org (in addition to the GitHub Packages release)
        type: boolean
        required: false
        default: false

env:
  # Pinned to match build/_build.csproj's Nuke.Common reference - keep these two in sync.
  NUKE_VERSION: 10.1.0
  # C24: the hosted live job constitutes its own WinGet runtime instead of accepting whatever
  # the runner image carries. Pinned to the library's Microsoft.WindowsPackageManager.ComInterop
  # reference in SubZeroDev.WinGet/SubZeroDev.WinGet.csproj - keep these two in sync, so the
  # client winmd and the server implementation always share one COM contract version.
  WINGET_VERSION: 1.29.280

jobs:
  # Runs on every push to main AND every pull request: tests, coverage, architecture,
  # and package-contract verification, but never publishes. This is the required
  # status check for branch protection.
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job never publishes, so it does not strictly need full history — a shallow
          # clone would only make Nuke's eager [GitVersion] injection emit a harmless warning
          # (the value is never dereferenced here; only PublishGitHubPackages reads it).
          # fetch-depth: 0 purely silences that warning and keeps both jobs' checkouts identical.
          fetch-depth: 0

      - name: Setup .NET
        # Skipped under act host mode — the host machine already has a .NET SDK.
        if: ${{ !env.ACT }}
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x: builds and runs the product (library/tests/examples target net8).
          # 10.0.x: runs the Nuke build tooling (build/_build.csproj is net10 — Nuke.Common
          #         10.x ships lib/net10.0 only). Nuke shells out to the net8 targets.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          # `update` (not `install`) so this is idempotent: it installs the tool when
          # missing and is a no-op success when the pinned version is already present.
          # `install --version X` instead errors if a *different* version is already on
          # the host - which happens under `act` host mode (the host environment persists
          # between runs) whenever NUKE_VERSION is bumped.
          dotnet tool update --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      # verification: true
      - name: Test, coverage, architecture, and package
        # One Nuke invocation for all requested targets. Nuke de-duplicates target execution
        # only WITHIN a single invocation, so Test and Coverage must be requested together —
        # separate `nuke Test` then `nuke Coverage` calls would re-run Test (and its
        # Restore/Compile dependencies). Coverage depends on Test, so the plan runs
        # Restore -> Compile -> Test -> Coverage exactly once, while ArchitectureTest
        # cross-builds x64/ARM64 and verifies the emitted PE headers. PackageTest then
        # validates the packed direct and transitive consumer contract without executing
        # live COM calls. A failure stops the job before release. The append step below
        # surfaces the generated markdown on the run's summary page (GITHUB_STEP_SUMMARY).
        run: nuke Test Coverage ArchitectureTest PackageTest --configuration Release

      - name: Append coverage summary
        run: Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      # S14.6/C27: this required check never activates WinGet COM (C7), so it is blind to every
      # C26 live-licensed translation by construction. Recorded explicitly so a green hermetic
      # check is never read as evidence about one - the machine-state and catalog jobs' own
      # evidence records are the only place any of them are licensed.
      - name: Record hermetic evidence
        if: always()
        shell: pwsh
        run: |
          @(
            '## Hermetic evidence',
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)",
            'This required check never activates WinGet COM, queries a network catalog, or invokes the WinGet CLI binary (C7).',
            'Non-assertion: every C26 live-licensed translation - ToPackages, ToPackageInfo, ToPackageDetails, CopyAgreements, CopyDocumentations, CopyIcons, ToPackageSource, GetPriority, FindVersionId, GetInstallerErrorCode - is licensed by nothing here. A regression in one is detectable only by the machine-state or catalog job whose named assertion covers it (or, for GetInstallerErrorCode, by nothing while install/upgrade live coverage remains a non-goal).'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/Cobertura.xml

  # S8.1/S8.3: MachineStateTest and PackedConsumerSmokeTest share one job and one required
  # pull-request status, per C8. C23's precondition was satisfied by a hosted run (33671049835,
  # commit 44afa873, 2026-09-02) that recorded the packed consumer observing a non-null WinGet
  # version (1.29.280) after this job's pinned install step ran, and the Main ruleset was then
  # updated (2026-09-03) to require this job's status. That requirement lives in repository
  # settings, not in this file.
  #
  # S16.1/S16.2: carries no event condition, so it runs for a pull request, a push to main, a
  # `v*` tag push, and a `workflow_dispatch` alike - every event `release` can reach - and
  # `release` declares `needs: [build, machine-state]` below. A `needs:` on a skipped job blocks
  # its dependent, so a narrower `if:` here would make publishing unreachable rather than gated.
  machine-state:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          dotnet tool update --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Check WinGet prerequisite
        id: prerequisite
        shell: pwsh
        run: |
          $package = Get-AppxPackage Microsoft.DesktopAppInstaller -ErrorAction SilentlyContinue
          if ($null -eq $package) {
            throw 'WinGet/App Installer is not installed on this runner.'
          }

          # C4 requires the environment fact to be observed rather than inferred from a
          # successful call. Capture it here, where it exists whether or not the checks below
          # later succeed - the previous shape read the version out of the consumer's own
          # stdout, so the run that most needed it was the one run that never recorded it.
          "before=$($package.Version)" | Add-Content -Path $env:GITHUB_OUTPUT

      # The runner image pins no WinGet version at all and has shipped builds predating COM
      # contract 13, where PackageManager.Version does not exist - see design/90-decisions.md,
      # 2026-08-21. Downloading a specific release tag is what makes C24's "explicitly pinned
      # build" true; the published SHA256 sidecars make it verifiable rather than asserted,
      # since a tag can be moved and a hash cannot.
      - name: Install pinned WinGet
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Invoke-WebRequest's progress rendering dominates the runtime of a 200 MB download.
          $ProgressPreference = 'SilentlyContinue'

          $base = "https://github.com/microsoft/winget-cli/releases/download/v$env:WINGET_VERSION"
          $work = (New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'winget-pin')).FullName

          foreach ($asset in 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle',
                             'DesktopAppInstaller_Dependencies.zip') {
            $file = Join-Path $work $asset
            Invoke-WebRequest "$base/$asset" -OutFile $file

            # Downloaded rather than read from the response body: GitHub serves release assets
            # as application/octet-stream, so Invoke-WebRequest hands back Content as bytes.
            $sidecar = Join-Path $work ([IO.Path]::GetFileNameWithoutExtension($asset) + '.txt')
            Invoke-WebRequest "$base/$([IO.Path]::GetFileName($sidecar))" -OutFile $sidecar

            $expected = (Get-Content -Path $sidecar -Raw).Trim()
            $actual = (Get-FileHash -Path $file -Algorithm SHA256).Hash

            if ($actual -ne $expected) {
              throw "$asset hash mismatch: expected $expected, got $actual."
            }
          }

          Expand-Archive -Path (Join-Path $work 'DesktopAppInstaller_Dependencies.zip') `
                         -DestinationPath (Join-Path $work 'dependencies') -Force

          # -DependencyPath installs only the dependencies the bundle actually needs, so an
          # already-present VCLibs is skipped rather than failing as an unnecessary downgrade.
          # The runner is x64; ARM64 runtime execution is a binding non-goal in design/00-brief.md.
          $dependencies = @(Get-ChildItem -Path (Join-Path $work 'dependencies') -Recurse -Include *.appx, *.msix |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' })

          $arguments = @{
            Path = Join-Path $work 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
            ForceUpdateFromAnyVersion = $true
          }

          # An empty -DependencyPath is an error rather than a no-op, so omit it when the layout
          # yielded nothing. A genuinely missing dependency then fails the bundle install below,
          # which is the outcome that should fail the gate anyway.
          if ($dependencies.Count -gt 0) { $arguments.DependencyPath = $dependencies.FullName }

          Add-AppxPackage @arguments

          $package = Get-AppxPackage Microsoft.DesktopAppInstaller
          if ($null -eq $package) {
            throw 'App Installer is absent after installing the pinned build.'
          }

          "after=$($package.Version)" | Add-Content -Path $env:GITHUB_OUTPUT

      # One Nuke invocation for both targets (Nuke de-duplicates Restore/Compile within it,
      # same reasoning as the hermetic job). SetLoggers("trx") plus the detailed console logger
      # in build/Build.cs give this a per-test retained record, not just a job-level pass/fail
      # (S8.4/S8.6).
      - name: Run machine-state and packed-consumer checks
        id: checks
        shell: pwsh
        run: |
          nuke MachineStateTest PackedConsumerSmokeTest --configuration Release 2>&1 |
            Tee-Object -FilePath machine-state.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record machine-state evidence
        if: always()
        shell: pwsh
        env:
          PREREQUISITE_OUTCOME: ${{ steps.prerequisite.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          APP_INSTALLER_BEFORE: ${{ steps.prerequisite.outputs.before }}
          APP_INSTALLER_AFTER: ${{ steps.install.outputs.after }}
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $version = if (Test-Path machine-state.log) {
            Select-String -Path machine-state.log -Pattern '^WinGet version:' |
              Select-Object -Last 1 | ForEach-Object Line
          }

          @(
            '## Machine-state evidence',
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)",
            "OS: $([Environment]::OSVersion.VersionString)",
            "Architecture: $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)",
            "Interactive: $([Environment]::UserInteractive)",
            "Elevated: $elevated",
            "WinGet prerequisite: $env:PREREQUISITE_OUTCOME",
            "Pinned WinGet install: $env:INSTALL_OUTCOME (v$env:WINGET_VERSION)",
            "App Installer before: $(if ($env:APP_INSTALLER_BEFORE) { $env:APP_INSTALLER_BEFORE } else { '(not observed)' })",
            "App Installer after: $(if ($env:APP_INSTALLER_AFTER) { $env:APP_INSTALLER_AFTER } else { '(not observed)' })",
            "MachineStateTest (7 tests, C8) + PackedConsumerSmokeTest: $env:CHECKS_OUTCOME",
            "Observed $($version ?? 'WinGet version: (not observed)')",
            'Configured-source state (C4) is asserted by GetSources_ReturnsTheConfiguredSources and GetSource_ForWinget_ReturnsIt within the checks above; per-test outcomes are in the retained log and trx artifact, not restated here.',
            # S14.4: this job's own share of the ten C26 live-licensed translations.
            'Licensed here: ToPackageSource, GetPriority (via GetSource_ForWinget_ReturnsIt).',
            'Non-assertion: ToPackages, ToPackageInfo, ToPackageDetails, CopyAgreements, CopyDocumentations, CopyIcons, FindVersionId are not reached by this job - see the catalog job''s evidence. GetInstallerErrorCode is reachable only from Install/Upgrade, a binding non-goal (C26), and is licensed by nothing.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload machine-state evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-state-evidence
          path: |
            machine-state.log
            TestResults/MachineState/**

  # S8.1/S8.7: CatalogIntegrationTest runs in its own job so a catalog outage or a changed
  # remote witness fails only this status and never erases the machine-state job's separately
  # passing evidence. Deliberately not required by branch protection (S8.3) - catalog drift in
  # Microsoft's live service must never itself block a merge.
  #
  # S16.3: carries no event condition either, and records its own evidence for a push, a tag
  # push, and a `workflow_dispatch` alike, same as machine-state - but deliberately absent from
  # `release`'s `needs`: a catalog failure on a tag is a recorded red job and does not stop
  # publication, per the non-required status above.
  catalog:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          dotnet tool update --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Check WinGet prerequisite
        id: prerequisite
        shell: pwsh
        run: |
          $package = Get-AppxPackage Microsoft.DesktopAppInstaller -ErrorAction SilentlyContinue
          if ($null -eq $package) {
            throw 'WinGet/App Installer is not installed on this runner.'
          }

          "before=$($package.Version)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Install pinned WinGet
        id: install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $base = "https://github.com/microsoft/winget-cli/releases/download/v$env:WINGET_VERSION"
          $work = (New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'winget-pin')).FullName

          foreach ($asset in 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle',
                             'DesktopAppInstaller_Dependencies.zip') {
            $file = Join-Path $work $asset
            Invoke-WebRequest "$base/$asset" -OutFile $file

            $sidecar = Join-Path $work ([IO.Path]::GetFileNameWithoutExtension($asset) + '.txt')
            Invoke-WebRequest "$base/$([IO.Path]::GetFileName($sidecar))" -OutFile $sidecar

            $expected = (Get-Content -Path $sidecar -Raw).Trim()
            $actual = (Get-FileHash -Path $file -Algorithm SHA256).Hash

            if ($actual -ne $expected) {
              throw "$asset hash mismatch: expected $expected, got $actual."
            }
          }

          Expand-Archive -Path (Join-Path $work 'DesktopAppInstaller_Dependencies.zip') `
                         -DestinationPath (Join-Path $work 'dependencies') -Force

          $dependencies = @(Get-ChildItem -Path (Join-Path $work 'dependencies') -Recurse -Include *.appx, *.msix |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' })

          $arguments = @{
            Path = Join-Path $work 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
            ForceUpdateFromAnyVersion = $true
          }

          if ($dependencies.Count -gt 0) { $arguments.DependencyPath = $dependencies.FullName }

          Add-AppxPackage @arguments

          $package = Get-AppxPackage Microsoft.DesktopAppInstaller
          if ($null -eq $package) {
            throw 'App Installer is absent after installing the pinned build.'
          }

          "after=$($package.Version)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Run catalog-integration checks
        id: checks
        shell: pwsh
        run: |
          nuke CatalogIntegrationTest --configuration Release 2>&1 |
            Tee-Object -FilePath catalog.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record catalog evidence
        if: always()
        shell: pwsh
        env:
          PREREQUISITE_OUTCOME: ${{ steps.prerequisite.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          APP_INSTALLER_BEFORE: ${{ steps.prerequisite.outputs.before }}
          APP_INSTALLER_AFTER: ${{ steps.install.outputs.after }}
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $version = if (Test-Path catalog.log) {
            Select-String -Path catalog.log -Pattern '^WinGet version:' |
              Select-Object -Last 1 | ForEach-Object Line
          }

          # S14.4/S14.5: the log carries whichever CopyAgreements/CopyDocumentations/CopyIcons
          # ran into an empty witness collection this run (TestContext.WriteLine, captured by
          # this job's Tee-Object'd log the same way the WinGet version line above is) - read
          # those back rather than asserting statically that every run licenses all three.
          $nonAssertions = if (Test-Path catalog.log) {
            Select-String -Path catalog.log -Pattern '^\s*Non-assertion:' |
              ForEach-Object { $_.Line.Trim() } | Select-Object -Unique
          }

          @(
            '## Catalog-integration evidence',
            "Commit: $env:GITHUB_SHA",
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID (attempt $env:GITHUB_RUN_ATTEMPT)",
            "OS: $([Environment]::OSVersion.VersionString)",
            "Architecture: $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)",
            "Interactive: $([Environment]::UserInteractive)",
            "Elevated: $elevated",
            "WinGet prerequisite: $env:PREREQUISITE_OUTCOME",
            "Pinned WinGet install: $env:INSTALL_OUTCOME (v$env:WINGET_VERSION)",
            "App Installer before: $(if ($env:APP_INSTALLER_BEFORE) { $env:APP_INSTALLER_BEFORE } else { '(not observed)' })",
            "App Installer after: $(if ($env:APP_INSTALLER_AFTER) { $env:APP_INSTALLER_AFTER } else { '(not observed)' })",
            "CatalogIntegrationTest (6 tests, C8): $env:CHECKS_OUTCOME",
            "Observed $($version ?? 'WinGet version: (not observed)')",
            'Remote-catalog reachability (C4) is the fact these six tests assert against the configured winget/msstore sources; per-test outcomes are in the retained log and trx artifact.',
            # S14.4: this job's own share of the ten C26 live-licensed translations.
            'Licensed here: ToPackages, ToPackageInfo, ToPackageDetails, FindVersionId, plus whichever of CopyAgreements/CopyDocumentations/CopyIcons the witness''s manifest actually populated this run (see Non-assertion lines below for the rest).',
            'Non-assertion: ToPackageSource, GetPriority are not reached by this job - see the machine-state job''s evidence. GetInstallerErrorCode is reachable only from Install/Upgrade, a binding non-goal (C26), and is licensed by nothing.'
          ) + $nonAssertions | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload catalog evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-evidence
          path: |
            catalog.log
            TestResults/CatalogIntegration/**

  # Builds and releases the package. Three ways in, all gated on `build` AND `machine-state`
  # (S16.2) so nothing publishes unless both the hermetic checks and the tagged commit's own
  # live machine-state run pass:
  #   push to main   -> GitHub Packages, PRERELEASE version (0.1.0-<n>)
  #   push tag v*    -> GitHub Packages, STABLE version (0.1.0)
  #   workflow_dispatch with push_to_nuget -> NuGet.org
  # A tag push is still a `push` event, so the event_name check below covers it.
  # Pull requests never reach this job — they run the full non-publishing verification
  # suite above, including architecture and package-contract checks.
  release:
    needs: [build, machine-state]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_to_nuget == true) }}
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job DOES publish, so it genuinely needs full history: PublishGitHubPackages
          # dereferences the [GitVersion] field to derive the package version, which is fatal
          # (not just a warning) on a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x: builds and runs the product (library/tests/examples target net8).
          # 10.0.x: runs the Nuke build tooling (build/_build.csproj is net10 — Nuke.Common
          #         10.x ships lib/net10.0 only). Nuke shells out to the net8 targets.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        run: |
          # `update` (not `install`) so this is idempotent: it installs the tool when
          # missing and is a no-op success when the pinned version is already present.
          # `install --version X` instead errors if a *different* version is already on
          # the host - which happens under `act` host mode (the host environment persists
          # between runs) whenever NUKE_VERSION is bumped.
          dotnet tool update --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      # Automatic release on every push to main. Version comes from GitVersion (resolved
      # by Nuke's GitVersion component). Auth uses the built-in GITHUB_TOKEN — no secret
      # needed — and --skip-duplicate makes re-pushing an unchanged version harmless.
      # C21/S11.1: the target itself fails unless it positively confirms the exact pushed
      # version back from the feed - push success or a skipped duplicate is not enough. The
      # "Publication confirmed:" line PublicationConfirmation.Report writes is appended to the
      # run summary, matching how machine-state/catalog evidence is recorded elsewhere in this
      # workflow.
      - name: Release to GitHub Packages
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        run: |
          nuke PublishGitHubPackages --github-token "${{ secrets.GITHUB_TOKEN }}" --github-repository-owner "${{ github.repository_owner }}" 2>&1 |
            Tee-Object -FilePath publish-github-packages.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path publish-github-packages.log -Pattern '^Publication confirmed:' |
            ForEach-Object Line | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      # Manual, opt-in release to NuGet.org. Requires the NUGET_API_KEY secret and
      # publishes the version pinned in the .csproj. Same S11.2 confirmation requirement as
      # GitHub Packages above.
      - name: Release to NuGet.org
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          nuke PublishNuGet --nuget-api-key "${{ secrets.NUGET_API_KEY }}" 2>&1 |
            Tee-Object -FilePath publish-nuget.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Select-String -Path publish-nuget.log -Pattern '^Publication confirmed:' |
            ForEach-Object Line | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
