name: Build

on:
  push:
    branches: [main]
    # Tag pushes publish the STABLE version: GitVersion emits a clean version for a
    # tagged commit, versus a prerelease for an untagged one. This filter is required —
    # with only `branches:` specified, GitHub does not run the workflow for tag pushes
    # at all, so `git push origin v0.1.0` would silently do nothing.
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: Also publish the package to NuGet.org (in addition to the GitHub Packages release)
        type: boolean
        required: false
        default: false

env:
  # Pinned to match build/_build.csproj's Nuke.Common reference - keep these two in sync.
  NUKE_VERSION: 10.1.0
  # C24: the hosted live job constitutes its own WinGet runtime instead of accepting whatever
  # the runner image carries. Pinned to the library's Microsoft.WindowsPackageManager.ComInterop
  # reference in SubZeroDev.WinGet/SubZeroDev.WinGet.csproj - keep these two in sync, so the
  # client winmd and the server implementation always share one COM contract version.
  WINGET_VERSION: 1.29.280

jobs:
  # Runs on every push to main AND every pull request: tests, coverage, architecture,
  # and package-contract verification, but never publishes. Its `build / Result` job is
  # the required status check for branch protection.
  #
  # The shared dotnet.yml workflow checks out, sets up both SDKs, restores and builds;
  # build/ci/Test-HermeticCheck.ps1 then runs `Test Coverage ArchitectureTest PackageTest`
  # in one Nuke invocation, appends the coverage summary and records the hermetic evidence
  # (S14.6/C27). `test: false` leaves the tests to Nuke, which owns the coverage floor (S9).
  #
  # GitHub checks every permission the shared workflow's jobs declare before it starts, including
  # its pack, publish and release jobs, which this job never runs. The jobs that do run read.
  build:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/dotnet.yml@v1
    with:
      os: '["windows-latest"]'
      # 8.0.x: builds and runs the product (library/tests/examples target net8).
      # 10.0.x: runs the Nuke build tooling (build/_build.csproj is net10 — Nuke.Common
      #         10.x ships lib/net10.0 only). Nuke shells out to the net8 targets.
      dotnet-version: |
        8.0.x
        10.0.x
      solution: SubZeroDev.WinGet.sln
      test: false
      # This job never publishes, so it does not strictly need full history — a shallow
      # clone would only make Nuke's eager [GitVersion] injection emit a harmless warning
      # (the value is never dereferenced here; only PublishGitHubPackages reads it).
      # Full history purely silences that warning and keeps every job's checkout identical.
      fetch-depth: 0
      post-build: build/ci/Test-HermeticCheck.ps1

  # S8.1/S8.3: MachineStateTest and PackedConsumerSmokeTest share one job and one required
  # pull-request status, per C8. C23's precondition was satisfied by a hosted run (33671049835,
  # commit 44afa873, 2026-09-02) that recorded the packed consumer observing a non-null WinGet
  # version (1.29.280) after this job's pinned install step ran, and the Main ruleset was then
  # updated (2026-09-03) to require this job's status. That requirement lives in repository
  # settings, not in this file.
  #
  # S16.1/S16.2: carries no event condition, so it runs for a pull request, a push to main, a
  # `v*` tag push, and a `workflow_dispatch` alike - every event `release` can reach - and
  # `release` declares `needs: [build, machine-state]` below. A `needs:` on a skipped job blocks
  # its dependent, so a narrower `if:` here would make publishing unreachable rather than gated.
  machine-state:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        shell: pwsh
        run: ./build/ci/Install-Nuke.ps1

      - name: Check WinGet prerequisite
        id: prerequisite
        shell: pwsh
        run: ./build/ci/Test-WinGetPrerequisite.ps1

      - name: Install pinned WinGet
        id: install
        shell: pwsh
        run: ./build/ci/Install-PinnedWinGet.ps1

      - name: Run machine-state and packed-consumer checks
        id: checks
        shell: pwsh
        run: ./build/ci/Invoke-MachineStateChecks.ps1

      - name: Record machine-state evidence
        if: always()
        shell: pwsh
        env:
          PREREQUISITE_OUTCOME: ${{ steps.prerequisite.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          APP_INSTALLER_BEFORE: ${{ steps.prerequisite.outputs.before }}
          APP_INSTALLER_AFTER: ${{ steps.install.outputs.after }}
        run: ./build/ci/Write-LiveEvidence.ps1 -Gate MachineState

      - name: Upload machine-state evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine-state-evidence
          path: |
            machine-state.log
            TestResults/MachineState/**

  # S8.1/S8.7: CatalogIntegrationTest runs in its own job so a catalog outage or a changed
  # remote witness fails only this status and never erases the machine-state job's separately
  # passing evidence. Deliberately not required by branch protection (S8.3) - catalog drift in
  # Microsoft's live service must never itself block a merge.
  #
  # S16.3: carries no event condition either, and records its own evidence for a push, a tag
  # push, and a `workflow_dispatch` alike, same as machine-state - but deliberately absent from
  # `release`'s `needs`: a catalog failure on a tag is a recorded red job and does not stop
  # publication, per the non-required status above.
  catalog:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        shell: pwsh
        run: ./build/ci/Install-Nuke.ps1

      - name: Check WinGet prerequisite
        id: prerequisite
        shell: pwsh
        run: ./build/ci/Test-WinGetPrerequisite.ps1

      - name: Install pinned WinGet
        id: install
        shell: pwsh
        run: ./build/ci/Install-PinnedWinGet.ps1

      - name: Run catalog-integration checks
        id: checks
        shell: pwsh
        run: ./build/ci/Invoke-CatalogChecks.ps1

      - name: Record catalog evidence
        if: always()
        shell: pwsh
        env:
          PREREQUISITE_OUTCOME: ${{ steps.prerequisite.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          APP_INSTALLER_BEFORE: ${{ steps.prerequisite.outputs.before }}
          APP_INSTALLER_AFTER: ${{ steps.install.outputs.after }}
        run: ./build/ci/Write-LiveEvidence.ps1 -Gate Catalog

      - name: Upload catalog evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-evidence
          path: |
            catalog.log
            TestResults/CatalogIntegration/**

  # Builds and releases the package. Three ways in, all gated on `build` AND `machine-state`
  # (S16.2) so nothing publishes unless both the hermetic checks and the tagged commit's own
  # live machine-state run pass:
  #   push to main   -> GitHub Packages, PRERELEASE version (0.1.0-<n>)
  #   push tag v*    -> GitHub Packages, STABLE version (0.1.0)
  #   workflow_dispatch with push_to_nuget -> NuGet.org
  # A tag push is still a `push` event, so the event_name check below covers it.
  # Pull requests never reach this job — they run the full non-publishing verification
  # suite above, including architecture and package-contract checks.
  release:
    needs: [build, machine-state]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_to_nuget == true) }}
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job DOES publish, so it genuinely needs full history: PublishGitHubPackages
          # dereferences the [GitVersion] field to derive the package version, which is fatal
          # (not just a warning) on a shallow clone.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 8.0.x: builds and runs the product (library/tests/examples target net8).
          # 10.0.x: runs the Nuke build tooling (build/_build.csproj is net10 — Nuke.Common
          #         10.x ships lib/net10.0 only). Nuke shells out to the net8 targets.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Nuke
        shell: pwsh
        run: ./build/ci/Install-Nuke.ps1

      # Automatic release on every push to main; see build/ci/Publish-Package.ps1 (C21/S11.1).
      - name: Release to GitHub Packages
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/ci/Publish-Package.ps1 -Feed GitHubPackages

      # Manual, opt-in release to NuGet.org. Requires the NUGET_API_KEY secret (S11.2).
      - name: Release to NuGet.org
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: ./build/ci/Publish-Package.ps1 -Feed NuGet

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
