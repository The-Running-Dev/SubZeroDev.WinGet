name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: Also publish the package to NuGet.org (in addition to the GitHub Packages release on main)
        type: boolean
        required: false
        default: false

env:
  # Pinned to match build/_build.csproj's Nuke.Common reference - keep these two in sync.
  NUKE_VERSION: 10.1.0

jobs:
  # Runs on every push to main AND every pull request: tests + coverage only, never
  # packs or publishes. This is the required status check for branch protection.
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Nuke's eager [GitVersion] injection doesn't warn; harmless here.
          fetch-depth: 0

      - name: Setup .NET
        # Skipped under act host mode — the host machine already has a .NET SDK.
        if: ${{ !env.ACT }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Nuke
        run: |
          dotnet tool install --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Test
        # Restore and Compile run first automatically as Test's Nuke dependencies.
        # A failing test fails this step and stops the job.
        run: nuke Test --configuration Release

      - name: Coverage report
        # Renders the coverage summary produced by Test into markdown; the append below
        # surfaces it on the workflow run's summary page (GITHUB_STEP_SUMMARY).
        run: nuke Coverage --configuration Release

      - name: Append coverage summary
        run: Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/Cobertura.xml

  # Builds and releases the package. Runs only on pushes to main (automatic GitHub
  # Packages release), or a manual workflow_dispatch that opts into a NuGet.org release.
  # Pull requests never reach this job, so they only ever run tests + coverage above.
  # Gated on `build` so nothing publishes unless tests pass.
  release:
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_to_nuget == true) }}
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs full history to derive the package version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Nuke
        run: |
          dotnet tool install --global Nuke.GlobalTool --version ${{ env.NUKE_VERSION }}
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      # Automatic release on every push to main. Version comes from GitVersion (resolved
      # by Nuke's GitVersion component). Auth uses the built-in GITHUB_TOKEN — no secret
      # needed — and --skip-duplicate makes re-pushing an unchanged version harmless.
      - name: Release to GitHub Packages
        if: ${{ github.event_name == 'push' }}
        run: nuke PublishGitHubPackages --github-token "${{ secrets.GITHUB_TOKEN }}" --github-repository-owner "${{ github.repository_owner }}"

      # Manual, opt-in release to NuGet.org. Requires the NUGET_API_KEY secret and
      # publishes the version pinned in the .csproj.
      - name: Release to NuGet.org
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: nuke PublishNuGet --nuget-api-key "${{ secrets.NUGET_API_KEY }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg
