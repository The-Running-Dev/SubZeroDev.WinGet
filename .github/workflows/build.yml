name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    # Publishing a GitHub Release (which creates/points at a tag) triggers the
    # publish-github-packages job below. GitVersion derives the version from that tag.
    types: [published]
  workflow_dispatch:
    inputs:
      push_to_nuget:
        description: Push the built package to NuGet.org
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        # Skipped under act host mode — the host machine already has a .NET SDK.
        if: ${{ !env.ACT }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SubZeroDev.WinGet.sln

      - name: Build
        run: dotnet build SubZeroDev.WinGet.sln --configuration Release --no-restore

      - name: Test
        # Integration tests are NUnit [Explicit] and are automatically excluded here;
        # only the mocked unit tests run (no WinGet/COM needed on the runner).
        # A failing test fails this step and stops the job — Pack/Push never run.
        run: dotnet test SubZeroDev.WinGet.sln --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Coverage report
        # Renders the coverage summary onto the workflow run page (GITHUB_STEP_SUMMARY),
        # which surfaces alongside the green/red check on the commit/PR.
        run: |
          dotnet tool update --global dotnet-reportgenerator-globaltool
          & "$env:USERPROFILE\.dotnet\tools\reportgenerator.exe" -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage "-reporttypes:MarkdownSummaryGithub;Cobertura"
          Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/Cobertura.xml

      - name: Pack
        run: dotnet pack SubZeroDev.WinGet/SubZeroDev.WinGet.csproj --configuration Release --no-build --output artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

      - name: Push to NuGet.org
        # Off by default: runs only on a manual workflow_dispatch with push_to_nuget checked.
        # Requires the NUGET_API_KEY repository secret.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push_to_nuget == true }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicates

  # Publishes to GitHub Packages (the repo's public NuGet feed) when a GitHub Release
  # is published. Version comes from GitVersion (installed as a .NET tool) reading the
  # release tag. Gated on the build job so a release only publishes if build + tests pass.
  # Authentication uses the automatic GITHUB_TOKEN — no repository secret needed.
  publish-github-packages:
    needs: build
    if: ${{ github.event_name == 'release' }}
    runs-on: windows-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion needs full history and tags to derive the version.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute version (GitVersion)
        id: version
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.8.2
          $gitversion = "$env:USERPROFILE\.dotnet\tools\dotnet-gitversion.exe"
          $version = (& $gitversion . /output json | ConvertFrom-Json).SemVer
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "GitVersion computed: $version"

      - name: Pack
        run: dotnet pack SubZeroDev.WinGet/SubZeroDev.WinGet.csproj --configuration Release -p:Version=${{ steps.version.outputs.version }} --output artifacts

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate
