name: Docs

# Builds and deploys the Docusaurus site in website/ (content sourced from docs/)
# to GitHub Pages. Entirely separate from build.yml: this never gates the library's
# CI, and the library's CI never blocks a docs update.
#
# One-time manual prerequisite: repo Settings -> Pages -> Source must be set to
# "GitHub Actions". Until that's done, the deploy step below fails.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy in flight at a time; don't cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      # onBrokenLinks/onBrokenMarkdownLinks are set to 'throw' in docusaurus.config.js,
      # so this build step is also the link checker for every docs/ cross-reference.
      - name: Build
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
