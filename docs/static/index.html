<!doctype html>
<!--
  The docs render under /docs (routeBasePath: 'docs'), and the base image no
  longer ships a root page, so without this the bare domain 404s — and the bare
  domain is the URL the README advertises. Static files are copied to the build
  root, so this lands at / and forwards to the docs.

  Delete this if the site ever moves back to routeBasePath: '/', which would
  make the docs homepage the root on its own.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SubZeroDev.WinGet</title>
    <link rel="canonical" href="https://winget.subzerodev.com/docs/" />
    <meta http-equiv="refresh" content="0; url=/docs/" />
  </head>
  <body>
    <p>Redirecting to <a href="/docs/">the documentation</a>…</p>
  </body>
</html>
